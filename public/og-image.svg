<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Open Graph / social share image. For best compatibility, export this as a
       1200x630 PNG named og-image.png and update index.html to point at it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f" />
      <stop offset="1" stop-color="#120f26" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <rect x="80" y="88" width="96" height="96" rx="24" fill="url(#accent)" />
  <text x="128" y="152" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="42" font-weight="700"
        fill="#0a0a0f" text-anchor="middle">IU</text>

  <text x="80" y="330" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="82" font-weight="700"
        fill="#ffffff">Ikram Ullah</text>
  <text x="80" y="410" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="34" font-weight="600"
        fill="url(#accent)">Full Stack &amp; App Developer · AI Automation</text>
  <text x="80" y="480" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="400"
        fill="#94a3b8">I build robust systems designed for measurable real-world impact.</text>

  <rect x="80" y="524" width="220" height="10" rx="5" fill="url(#accent)" />
</svg>
